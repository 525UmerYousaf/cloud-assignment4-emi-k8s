# Connection string for the web pods. No credentials are used, so a
# ConfigMap is appropriate (a Secret would be used if it held a password).
# Listing all three members lets the driver find whichever is PRIMARY.
apiVersion: v1
kind: ConfigMap
metadata:
  name: emi-config
  namespace: emi
data:
  MONGO_URL: "mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/emidb?replicaSet=rs0"
